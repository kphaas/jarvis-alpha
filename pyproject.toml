[project]
name = "jarvis-alpha"
version = "0.1.0"
description = "JARVIS Alpha private AI infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "bcrypt==4.2.1",
    "pydantic==2.11.1",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.12.1",
    "cryptography==46.0.7",
    "httpx==0.28.1",
    "requests==2.32.3",
    "temporalio==1.26.0",
    "google-auth==2.38.0",
    "python-multipart==0.0.20",
    "PyYAML==6.0.3",
    "pdfplumber==0.11.4",
    "openpyxl==3.1.5",
    "trafilatura==2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "^db/alembic/",
    "^scripts/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "brain.agents.buddy_agent",
    "brain.agents.chatops_smoke",
    "brain.agents.network_watchdog",
    "brain.agents.porchlight",
    "brain.agents.privacy_scrub.drafts",
    "brain.agents.warden",
    "brain.agents.watchdog_agent",
    "brain.dream.briefing",
    "brain.dream.worker",
    "brain.dream.workflows",
    "brain.dream.write_executor",
    "brain.memory.memory",
    "brain.memory_manager",
    "brain.routes.at0_mail",
    "brain.routes.chat",
    "brain.routes.costs",
    "brain.routes.dream",
    "brain.routes.memory",
    "brain.routes.mesh",
    "brain.routes.patterns",
    "brain.routes.privacy",
    "brain.routes.security",
    "brain.routes.spark_drafts",
    "brain.routes.spark_persona",
    "brain.services.at0_self_model",
    "brain.services.bluebubbles_client",
    "brain.services.internet_scout.answer_engine_evals",
    "brain.services.internet_scout.browser_runner",
    "brain.services.internet_scout.retention",
    "brain.services.internet_scout.search_quality_evals",
    "brain.services.memory_consolidation",
    "brain.services.memory_graph_extraction",
    "brain.services.spark_imessage_drafts",
    "brain.services.spark_personality_memory",
    "brain.services.spark_target_memory",
    "brain.services.temporal_storage_monitor",
    "brain.services.warden_posture",
    "brain.skills.approval_bridge",
    "brain.skills.policy_gate",
    "brain.taskgraph",
    "brain.thread_manager",
    "common.jarvis_common.logging_config",
    "gateway.adapters.gemini_adapter",
    "gateway.dream.orchestrator",
    "gateway.routes.notify",
    "gateway.routes.unifi",
    "gateway.routes.weather",
]
ignore_errors = true
