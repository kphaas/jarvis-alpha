[project]
name = "jarvis-alpha"
version = "0.1.0"
description = "JARVIS Alpha private AI infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "bcrypt==4.2.1",
    "pydantic==2.11.1",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.12.1",
    "cryptography==46.0.7",
    "httpx==0.28.1",
    "requests==2.32.3",
    "temporalio==1.26.0",
    "google-auth==2.38.0",
    "python-multipart==0.0.20",
    "pdfplumber==0.11.4",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
