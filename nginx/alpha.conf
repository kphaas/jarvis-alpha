server {
    listen 4100 ssl;
    listen 100.87.223.31:4100 ssl;
    server_name jarvis-endpoint.tail40ed36.ts.net localhost;

    ssl_certificate /Users/jarvisendpoint/jarvis/certs/endpoint.crt;
    ssl_certificate_key /Users/jarvisendpoint/jarvis/certs/endpoint.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /Users/jarvisendpoint/jarvis-alpha/ui/dist;
    index index.html;

    location /api/ {
        proxy_pass https://100.64.166.22:8186/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
