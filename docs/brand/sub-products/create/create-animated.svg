<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2B65A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs><style>@keyframes ping{0%{transform:scale(.55);opacity:.55}70%{opacity:0}100%{transform:scale(1.15);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}.ping{transform-origin:50px 50px;animation:ping 2.6s ease-out infinite}.sweep{transform-origin:50px 50px;animation:spin 4s linear infinite}@media (prefers-reduced-motion:reduce){.ping,.sweep{animation:none;opacity:.18}}</style><g class="sweep"><path d="M50 50 L50 17 A33 33 0 0 1 74 27 Z" fill="#62D8C4" opacity="0.16"/></g><circle class="ping" cx="50" cy="50" r="33" fill="none" stroke="#62D8C4" stroke-width="2"/><circle cx="50" cy="50" r="33" fill="none" stroke="#2C333F" stroke-width="6"/><circle cx="50" cy="50" r="33" fill="none" stroke="url(#ring)" stroke-width="6"/><circle cx="50" cy="17" r="5" fill="#62D8C4"/><g stroke="#F2EFE9" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 33 L63 40.5 L63 55.5 L50 63 L37 55.5 L37 40.5 Z"/>
