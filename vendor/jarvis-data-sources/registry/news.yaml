- id: ai-vendor-status-feeds
  name: AI Vendor Status Feeds
  domain: news
  url: https://status.openai.com/
  api_base_url: null
  auth:
    type: none
    notes: |
      No auth for public status pages. Verified RSS endpoints:
      https://status.openai.com/history.rss
      https://status.claude.com/history.rss
      https://azure.status.microsoft/en-us/status/feed/
  pricing: free
  free_tier: unlimited public status access (fair use)
  license: vendor-tos
  baa_available: not-applicable
  phi_safe: false
  primary_use_cases:
    - ai-vendor-status-monitoring
    - incident-awareness
    - outage-correlation
  notes: |
    Aggregate source for AI vendor health signals. OpenAI, Claude, and Azure
    status RSS feeds verified cleanly. AWS public status RSS currently returns
    RSS content from legacy status.aws.amazon.com paths but reports HTTP 404;
    for production AWS health ingest, prefer AWS Health/EventBridge or monitor
    the AWS Health Dashboard page before relying on the legacy RSS endpoint.
  last_verified: 2026-06-25
  review_cadence_days: 30
