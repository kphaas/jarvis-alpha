  auth:
    type: none
    notes: No auth. Official AWS What's New RSS feed filtered to artificial intelligence architecture tags.
  pricing: free
  free_tier: unlimited (fair use)
  license: vendor-tos
  baa_available: not-applicable
  phi_safe: false
  primary_use_cases:
    - ai-vendor-news
    - aws-bedrock-monitoring
    - cloud-ai-release-monitoring
  notes: |
    Official AWS launch feed filtered for artificial intelligence announcements.
    AWS also publishes broader What's New and Machine Learning Blog RSS feeds;
    keep this source focused on launch/update detection and route deeper
    implementation analysis through cited web search or AWS docs.
  last_verified: 2026-06-25
  review_cadence_days: 30

