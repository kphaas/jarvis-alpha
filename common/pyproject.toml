[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
description = "Shared modules for JARVIS Alpha infrastructure"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["jarvis_common*"]
