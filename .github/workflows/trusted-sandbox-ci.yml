name: trusted-sandbox-ci

# Manual backup for repo-owned no-secret checks on the trusted Sandbox runner.
# Forge native CI is the required automatic gate and posts
# `forge/native-ci-shadow`; keep this workflow manual to avoid duplicate PR
# work while retaining an operator-controlled fallback.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-sandbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-secrets-suite:
    name: no-secrets-suite
    if: >-
      vars.JARVIS_ENABLE_SANDBOX_RUNNER == 'true' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, sandbox, jarvis-alpha, trusted]
    timeout-minutes: 30
    env:
      PYTEST_MARKERS: ${{ vars.JARVIS_PYTEST_MARKERS != '' && vars.JARVIS_PYTEST_MARKERS || 'not integration' }}
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Assert trusted runner context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request)
              if [ "${HEAD_REPO}" != "${REPOSITORY}" ]; then
                echo "::error::Refusing self-hosted runner for fork PR ${HEAD_REPO}."
                exit 1
              fi
              case "${HEAD_REF}" in
                claude-code/*|codex/*) ;;
                *)
                  echo "::error::Self-hosted PR checks require claude-code/* or codex/* branches."
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch)
              echo "Manual trusted run."
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}."
              exit 1
              ;;
          esac

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          git --version
          python3 --version
          node --version
          npm --version

      - name: Install uv if missing
        run: |
          set -euo pipefail
          if command -v uv >/dev/null 2>&1; then
            uv --version
            exit 0
          fi

          python3 -m pip install --user --upgrade uv
          echo "${HOME}/Library/Python/3.12/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Python 3.12
        run: |
          set -euo pipefail
          uv python install 3.12

      - name: Sync Python dependencies
        run: |
          set -euo pipefail
          WORKSPACE_FLAG=""
          DEV_FLAG=""

          if grep -q '^\[tool\.uv\.workspace\]' pyproject.toml; then
            WORKSPACE_FLAG="--all-packages"
          fi
          if grep -qE '^\[dependency-groups\]|^\[tool\.uv\.dev-dependencies\]' pyproject.toml; then
            DEV_FLAG="--group dev"
          fi

          uv sync --python 3.12 ${WORKSPACE_FLAG} --all-extras ${DEV_FLAG}

      - name: Python lint and format
        run: |
          set -euo pipefail
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .

      - name: Python tests
        run: |
          set -euo pipefail
          set +e
          uv run --python 3.12 pytest -m "${PYTEST_MARKERS}"
          rc=$?
          set -e
          if [ "${rc}" -eq 5 ]; then
            echo "::notice::No tests matched marker filter '${PYTEST_MARKERS}'."
            exit 0
          fi
          exit "${rc}"

      - name: Beacon research quality gates
        run: |
          set -euo pipefail
          uv run --python 3.12 python scripts/eval_beacon_search_quality.py
          uv run --python 3.12 python scripts/export_beacon_contract_schema.py --check

      - name: Chat quality gates
        run: |
          set -euo pipefail
          uv run --python 3.12 python scripts/eval_chat_quality.py

      - name: UI install and build
        working-directory: ui
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Scrub transient runner paths
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "${RUNNER_TEMP}" ]; then
            find "${RUNNER_TEMP}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
