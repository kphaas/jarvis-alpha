# GitHub-hosted guardrails only.
#
# Expensive trusted checks moved to Forge native CI on Sandbox and report as
# `forge/native-ci-shadow`. Keep this workflow small so private-repo PRs do not
# spend hosted minutes on duplicate lint/typecheck/test jobs.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for the audit comparison against the baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install --quiet "detect-secrets==1.5.0"

      - name: Ban shell xtrace around secrets
        run: python scripts/check_no_xtrace_secrets.py

      - name: Detect duplicate config drift
        run: python scripts/check_duplicate_config_drift.py

      - name: Scan against baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::warning::No .secrets.baseline present; running scan in audit-only mode."
            detect-secrets scan > /tmp/scan.json || true
            python - <<'PY'
          import json
          with open('/tmp/scan.json') as f:
              report = json.load(f)
          findings = sum(len(v) for v in report.get('results', {}).items())
          print(f"detect-secrets reported {findings} potential findings (baseline missing).")
          PY
            exit 0
          fi

          detect-secrets scan --baseline .secrets.baseline
