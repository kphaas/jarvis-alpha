# Temporal UI config — single-node loopback
# All tunable values come from TEMPORAL_* env vars (documented override path):
# https://docs.temporal.io/references/web-ui-environment-variables
# This YAML covers only structural/boolean settings not exposed as env vars.
host: "127.0.0.1"
publicPath: ""
enableUi: true
feedbackURL: ""
notifyOnNewVersion: false
auth:
  enabled: false
cors:
  cookieInsecure: true
