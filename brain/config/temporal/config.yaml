# enable-template
log:
  stdout: true
  level: {{ env "TEMPORAL_LOG_LEVEL" | default "info" }}

persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal"
        connectAddr: "127.0.0.1:5432"
        connectProtocol: "tcp"
        user: "temporal"
        password: '{{ env "TEMPORAL_DB_PASSWORD" }}'
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"
    visibility:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal_visibility"
        connectAddr: "127.0.0.1:5432"
        connectProtocol: "tcp"
        user: "temporal"
        password: '{{ env "TEMPORAL_DB_PASSWORD" }}'
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: '{{ env "TEMPORAL_BIND_IP" }}'
  pprof:
    port: 7936

services:
  frontend:
    rpc:
      grpcPort: {{ env "TEMPORAL_GRPC_PORT" }}
      membershipPort: 6933
      bindOnIP: '{{ env "TEMPORAL_BIND_IP" }}'
      httpPort: 7243

  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: '{{ env "TEMPORAL_BIND_IP" }}'

  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: '{{ env "TEMPORAL_BIND_IP" }}'

  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: '{{ env "TEMPORAL_BIND_IP" }}'

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: '127.0.0.1:{{ env "TEMPORAL_GRPC_PORT" }}'
      httpAddress: "127.0.0.1:7243"

dcRedirectionPolicy:
  policy: "noop"

archival:
  history:
    state: "disabled"
  visibility:
    state: "disabled"

namespaceDefaults:
  archival:
    history:
      state: "disabled"
    visibility:
      state: "disabled"

publicClient:
  hostPort: '127.0.0.1:{{ env "TEMPORAL_GRPC_PORT" }}'

dynamicConfigClient:
  filepath: "/Users/jarvisbrain/jarvis/bin/temporal/current/config/dynamicconfig/docker.yaml"
  pollInterval: "10s"
